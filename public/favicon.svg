<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White rounded square -->
  <rect width="512" height="512" rx="110" fill="#ffffff"/>
  
  <!-- BS monogram — padded inward by ~46px on each side for breathing room -->
  <!-- All coordinates from bs_favicon_bw.svg scaled inward:
       original coords were for full 512, now we scale to a 420x420 box centered in 512
       Scale factor: 420/512 = 0.82, offset: (512-420)/2 = 46 -->

  <!-- B stem -->
  <rect x="178" y="150" width="29" height="212" rx="4" fill="#000000"/>

  <!-- B top lobe -->
  <path d="M207 150 L281 150 Q319 150 319 195 Q319 239 281 239 L207 239 L207 216 L277 216 Q295 216 295 195 Q295 174 277 174 L207 174 Z" fill="#000000"/>

  <!-- B bottom lobe (wider) -->
  <path d="M207 239 L285 239 Q329 239 329 285 Q329 331 285 331 L207 331 L207 308 L281 308 Q304 308 304 285 Q304 262 281 262 L207 262 Z" fill="#000000"/>

  <!-- S letterform -->
  <path d="M 325 195 Q 325 154 290 154 Q 256 154 256 186 Q 256 214 288 224 Q 334 238 334 275 Q 334 322 293 322 Q 250 322 250 290"
    fill="none"
    stroke="#000000"
    stroke-width="28"
    stroke-linecap="round"
  />
</svg>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const category = document.getElementById('category');
const pageSize = document.getElementById('pageSize');
const statusEl = document.getElementById('status');
let page = 1, showAll = false;
[...new Set(templates.map(t=>t.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o)});
function filtered(){const q=search.value.trim().toLowerCase();const c=category.value;return templates.filter(t=>(!c||t.category===c)&&(!q||t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||t.category.toLowerCase().includes(q)));}
function mountIframe(phone, src){if(phone.dataset.loaded)return;phone.dataset.loaded='1';const iframe=document.createElement('iframe');iframe.loading='lazy';iframe.src=src;iframe.setAttribute('title','Mobile website preview');phone.appendChild(iframe);const ph=phone.querySelector('.placeholder');if(ph)setTimeout(()=>ph.remove(),700);}
const observer = new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){mountIframe(e.target, e.target.dataset.src);observer.unobserve(e.target);}})},{rootMargin:'650px'});
function render(){grid.innerHTML='';const rows=filtered();const size=showAll?rows.length:Number(pageSize.value);const visible=rows.slice(0,page*size);statusEl.textContent=`Showing ${visible.length} of ${rows.length} filtered templates · iframe viewport 390 × 760 mobile`;visible.forEach((t,i)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="card-head"><div><div class="title">${t.title}</div><div class="cat">${t.id}</div></div><div class="cat">${t.category}</div></div><div class="phone" data-src="${t.url}"><div class="placeholder">Loading mobile view<br>${i+1} / ${rows.length}</div></div><div class="actions"><a href="${t.url}" target="_blank">Open</a><button type="button">Reload</button></div>`;const phone=card.querySelector('.phone');card.querySelector('button').onclick=()=>{phone.dataset.loaded='';phone.querySelector('iframe')?.remove();if(!phone.querySelector('.placeholder')){const p=document.createElement('div');p.className='placeholder';p.textContent='Reloading mobile view';phone.prepend(p);}mountIframe(phone,t.url)};grid.appendChild(card);observer.observe(phone);});if(!showAll&&visible.length<rows.length){const more=document.createElement('button');more.textContent=`Load more (${Math.min(size, rows.length-visible.length)})`;more.style.gridColumn='1/-1';more.style.margin='10px auto';more.onclick=()=>{page++;render();window.scrollBy({top:300,behavior:'smooth'})};grid.appendChild(more);}}
[search,category,pageSize].forEach(el=>el.addEventListener('input',()=>{page=1;showAll=false;render();}));
document.getElementById('loadAll').onclick=()=>{showAll=!showAll;document.getElementById('loadAll').textContent=showAll?'Paginate':'Show all';page=1;render();};
render();

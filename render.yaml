services:
  - type: web
    name: brand-syndicate
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brand-syndicate-db
          property: connectionString
      - key: NODE_ENV
        value: production

      # ── Puppeteer: skip Chromium download on Render ───────────────────────
      # Render provides Chromium via CHROMIUM_EXECUTABLE_PATH — we do not bundle it.
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: 'true'
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'true'

      # ── NextAuth v5 ───────────────────────────────────────────────────────
      # AUTH_SECRET: generate with: openssl rand -base64 32
      # AUTH_URL: full origin URL, no trailing slash, no path
      #   Correct:   https://www.brandsyndicate.in
      #   WRONG:     https://www.brandsyndicate.in/generate
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false

      # NextAuth v4 compat aliases — set to same values as above
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false

      # ── App URL ───────────────────────────────────────────────────────────
      # Used in OG tags, sitemaps, QR codes, canonical URLs
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # ── AI: Anthropic (REQUIRED) ──────────────────────────────────────────
      # Powers: website generation (streaming), business brief, strategy,
      #         content calendar, logo SVG concept (Haiku)
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── AI: OpenAI (OPTIONAL) ─────────────────────────────────────────────
      # Powers: logo image rendering and brand graphics via gpt-image-1
      # Without this key, logo and image generation show a clear error message.
      # All other generation routes (website, strategy, calendar) still work.
      - key: OPENAI_API_KEY
        sync: false

      # ── Payments: Razorpay (INR) ──────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Storage: Cloudinary ───────────────────────────────────────────────
      # Server-side vars (used in API routes for signed uploads)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Client-side vars (used in DigitalCardPanel for unsigned uploads)
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_PRESET
        sync: false

      # ── Email: Resend ─────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      # Verified sender address — must match your Resend domain
      - key: RESEND_FROM_EMAIL
        sync: false

      # ── Contact email ─────────────────────────────────────────────────────
      # Where contact form and support emails are delivered
      # Default: brandsyndicateindia@gmail.com
      - key: CONTACT_EMAIL
        sync: false

      # ── Pexels (OPTIONAL) ─────────────────────────────────────────────────
      # Sector-matched photography for website generation hero/about/accent images
      # Without this key, CSS gradients are used as fallback
      - key: PEXELS_API_KEY
        sync: false

      # ── Admin ─────────────────────────────────────────────────────────────
      - key: ADMIN_PASSWORD
        sync: false
      # Phone used for admin account seed — format: 91XXXXXXXXXX
      - key: ADMIN_PHONE
        sync: false

      # ── Cron: daily usage reset ───────────────────────────────────────────
      # Bearer token for GET /api/cron/reset-usage
      # Set up a Render cron job to call this at midnight IST
      - key: CRON_SECRET
        sync: false

      # ── Custom domain CNAME target ────────────────────────────────────────
      # The CNAME value users point their custom domain to
      # Default: cname.brandsyndicate.in
      - key: CNAME_TARGET
        sync: false

      # ── PDF export: Chromium path ─────────────────────────────────────────
      # Set automatically by Render's Puppeteer environment
      # Only needed if self-hosting outside Render
      - key: CHROMIUM_EXECUTABLE_PATH
        sync: false

      # ── Google Sheets lead export (OPTIONAL) ──────────────────────────────
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false

databases:
  - name: brand-syndicate-db
    plan: starter
    databaseName: brandsyndicate
